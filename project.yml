name: Futures
options:
  bundleIdPrefix: com.huangenxu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TradingChart:
    path: Vendor/TradingChart
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Futures:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TradingChart
        product: TradingChart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.futures
        INFOPLIST_KEY_CFBundleDisplayName: 期汇
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_QIHUI_API_BASE_URL: "https://8.153.96.190"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
