name: iOS Device IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-device-ipa.yml'
      - 'App/**'
      - 'Vendor/**'
      - 'scripts/**'
      - 'project.yml'

jobs:
  build-unsigned-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify strategy and structure calculations
        run: |
          swiftc -O App/Models/FormulaEngine.swift App/Models/FormulaComposition.swift App/Models/ChanStructure.swift App/Models/FuturesBacktest.swift scripts/StrategySelfTest.swift -o /tmp/strategy-test
          /tmp/strategy-test
          swiftc App/Models/MarketBar.swift App/Models/IntradaySession.swift scripts/IntradaySessionSelfTest.swift -o /tmp/intraday-test
          /tmp/intraday-test
          swiftc App/Models/PaperTrading.swift scripts/PaperTradingSelfTest.swift -o /tmp/paper-trading-test
          /tmp/paper-trading-test

      - name: Verify sandboxed formula engine
        run: |
          swiftc -O App/Models/FormulaEngine.swift App/Models/FormulaComposition.swift App/Models/MovingAverageConfiguration.swift scripts/FormulaEngineSelfTest.swift -o /tmp/formula-engine
          /tmp/formula-engine

      - name: Verify futures indicator calculations
        run: |
          swiftc -O App/Models/FuturesIndicatorMath.swift scripts/FuturesIndicatorSelfTest.swift -o /tmp/futures-indicators
          /tmp/futures-indicators

      - name: Verify direct live chart delivery
        run: |
          swiftc App/Models/DirectChartFeed.swift scripts/DirectChartFeedSelfTest.swift -o /tmp/direct-chart-feed-test
          /tmp/direct-chart-feed-test

      - name: Verify open candle quote time boundary
        run: |
          swiftc App/Models/OpenCandleQuotePolicy.swift scripts/OpenCandleQuoteSelfTest.swift -o /tmp/open-candle-quote-test
          /tmp/open-candle-quote-test

      - name: Verify immediate SSE line parsing
        run: |
          swiftc App/Models/SSELineBuffer.swift scripts/SSELineBufferSelfTest.swift -o /tmp/sse-line-test
          /tmp/sse-line-test

      - name: Verify futures price formatting
        run: |
          swiftc App/Models/MarketPricePrecision.swift scripts/MarketPricePrecisionSelfTest.swift -o /tmp/market-price-precision-test
          /tmp/market-price-precision-test

      - name: Verify corrected earlier K-line redraw
        run: |
          swiftc App/Models/KlineCorrectionPolicy.swift scripts/KlineCorrectionSelfTest.swift -o /tmp/kline-correction-test
          /tmp/kline-correction-test

      - name: Verify parallel cached-history and SSE merge
        run: |
          swiftc App/Models/KlineStartupMerge.swift scripts/KlineStartupMergeSelfTest.swift -o /tmp/kline-startup-merge-test
          /tmp/kline-startup-merge-test
      - name: Generate app icon asset
        run: swift scripts/generate-app-icon.swift

      - name: Prepare pinned PineTS resource
        run: |
          mkdir -p App/Resources
          curl --fail --location --retry 3 -o App/Resources/pinets.js https://github.com/LuxAlgo/PineTS/releases/download/v0.14.0/pinets.min.browser.js
          echo '0566f4af419ec9cbed3f7dbcd8957d051c85948ea388cd6c528fa9af6e517259  App/Resources/pinets.js' | shasum -a 256 -c -
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Futures.xcodeproj -scheme Futures

      - name: Build device archive without signing
        run: |
          xcodebuild \
            -project Futures.xcodeproj \
            -scheme Futures \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Futures.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/Futures.xcarchive/Products/Applications/Futures.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/pinets.js"
          echo "0566f4af419ec9cbed3f7dbcd8957d051c85948ea388cd6c528fa9af6e517259  $APP_PATH/pinets.js" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Futures.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -r "$RUNNER_TEMP/Futures-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Futures-unsigned-ipa
          path: ${{ runner.temp }}/Futures-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
