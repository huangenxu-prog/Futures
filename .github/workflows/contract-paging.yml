name: Contract paging acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  paging:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen || brew install xcodegen
      - run: xcodegen generate
      - name: Run entry and paging UI tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for rt,devices in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if "iOS-" in rt for d in devices if "iPhone" in d["name"]))')
          xcodebuild test -scheme Futures -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath Paging.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paging-results
          path: Paging.xcresult
      - name: Package tested revision
        run: |
          xcodebuild -scheme Futures -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Futures.app Payload/
          ditto -c -k --keepParent Payload Futures-paging-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Futures-paging-unsigned
          path: Futures-paging-unsigned.ipa
