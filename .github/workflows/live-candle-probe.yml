name: Live Candle Probe IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'App/Views/LiveCandleProbeView.swift'
      - '.github/workflows/live-candle-probe.yml'

jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and generate project
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew install xcodegen
          swift scripts/generate-app-icon.swift
          xcodegen generate
      - name: Build separate read-only device app
        run: |
          xcodebuild -project Futures.xcodeproj -scheme Futures \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiveProbe.xcarchive" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=QIHUI_LIVE_PROBE \
            PRODUCT_BUNDLE_IDENTIFIER=com.huangenxu.futures.liveprobe \
            INFOPLIST_KEY_CFBundleDisplayName=期汇实测 \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Verify identity and package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/LiveProbe.xcarchive/Products/Applications/Futures.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.huangenxu.futures.liveprobe
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = 期汇实测
          mkdir -p "$RUNNER_TEMP/probe/Payload"
          cp -R "$APP" "$RUNNER_TEMP/probe/Payload/Futures.app"
          cd "$RUNNER_TEMP/probe"
          zip -qr "$RUNNER_TEMP/Qihui-LiveProbe-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Qihui-LiveProbe-unsigned-ipa
          path: ${{ runner.temp }}/Qihui-LiveProbe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
