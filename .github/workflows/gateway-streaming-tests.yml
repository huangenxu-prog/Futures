name: Gateway Streaming Tests

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/gateway-streaming-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and offline stream checks
        run: |
          python3 -m py_compile server/market_gateway.py server/upgrade_gateway.py server/diagnose_kline.py server/benchmark_cold_kline.py server/prefetch_main_history.py
          python3 -m unittest discover -s server -p 'test_gateway_stream.py' -v
      - name: Check full-market historical cache planner
        run: python3 -m unittest discover -s server -p 'test_prefetch_main_history.py' -v
      - name: Verify Ubuntu 24.04 bootstrap
        run: bash server/test_bootstrap.sh
      - name: Verify IP HTTPS installer
        run: bash server/test_ip_https.sh
      - name: Verify whole-market installer
        run: |
          python3 -m py_compile server/install_aliyun_main_prefetch.py
          python3 -m unittest discover -s server -p 'test_install_aliyun_main_prefetch.py' -v
      - name: Verify Alibaba systemd updater
        run: bash server/test_aliyun_update.sh
      - name: Verify safe gateway updater
        run: bash server/test_gateway_upgrade.sh
